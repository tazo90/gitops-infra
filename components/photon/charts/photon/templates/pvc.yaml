{{- if .Values.storage.create }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: "{{ .Values.storage.persistentClaimName | default (include "photon.fullname" .) }}"
  labels:
    {{- include "photon.labels" . | nindent 4 }}
spec:
  storageClassName: {{ .Values.storage.storageClass | quote }}
  volumeName: {{ .Values.storage.persistentName | quote }}
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.storage.capacity }}
{{- end }}
