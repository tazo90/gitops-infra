kind: Deployment
apiVersion: apps/v1
metadata:
  name: redis
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        command: [ "redis-server", "/etc/redis/redis.conf" ]
        ports:
        - name: redis
          containerPort: 6379
        resources:
          requests:
            cpu: 50m
            memory: 200Mi
          limits:
            cpu: 100m
            memory: 400Mi
        livenessProbe:
          exec:
            command:
            - redis-cli
            - ping
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
        volumeMounts:
        - name: config
          mountPath: /etc/redis

      - name: redis-exporter
        image: oliver006/redis_exporter:v1.52.0
        ports:
        - name: http-metrics
          containerPort: 9121
        resources:
          requests:
            cpu: 50m
            memory: 50Mi
          limits:
            cpu: 100m
            memory: 100Mi
        livenessProbe:
          httpGet:
            path: /
            port: http-metrics
        readinessProbe:
          httpGet:
            path: /
            port: http-metrics

      volumes:
      - name: config
        secret:
          secretName: redis-config
