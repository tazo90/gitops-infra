apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: postgres

resources:
  - namespace.yaml

helmCharts:
  - name: postgresql
    version: 12.10.0
    repo: https://charts.bitnami.com/bitnami
    releaseName: postgres
    namespace: postgres
    valuesFile: postgres-values.yaml